name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        pip install ruff
        ruff check app.py --ignore=E402,F403,F405

    - name: Check imports
      run: |
        python -c "from app import app; print('✓ App loaded successfully')"
        python -c "
        from app import app
        rules = [r.rule for r in app.url_map.iter_rules()]
        assert '/' in rules, 'Missing / route'
        assert '/chat' in rules, 'Missing /chat route'
        assert '/feedback' in rules, 'Missing /feedback route'
        print('✓ All routes found:', rules)
        "
