<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0 20px;
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #a855f7, #6366f1, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        header h1 i {
            -webkit-text-fill-color: #a855f7;
        }

        header p {
            color: #94a3b8;
            margin-top: 8px;
            font-size: 1rem;
        }

        .function-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .function-tab {
            flex: 1;
            min-width: 180px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .function-tab:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .function-tab.active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(99, 102, 241, 0.2));
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .function-tab i {
            font-size: 1.5rem;
            color: #a855f7;
            display: block;
            margin-bottom: 8px;
        }

        .function-tab .func-name {
            font-weight: 600;
            font-size: 1rem;
            display: block;
        }

        .function-tab .func-desc {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
            display: block;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .prompt-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .prompt-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            background: transparent;
            color: #c4b5fd;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .prompt-btn:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: #a855f7;
        }

        .prompt-btn.active {
            background: rgba(168, 85, 247, 0.25);
            border-color: #a855f7;
            color: #fff;
        }

        textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.1);
        }

        textarea::placeholder {
            color: #64748b;
        }

        .submit-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 14px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .response-area {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 80px;
            display: none;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .response-area.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .response-area.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #94a3b8;
        }

        .response-area.loading::before {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid #a855f7;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .feedback-area {
            margin-top: 16px;
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        .feedback-area.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .feedback-area span {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .feedback-btn {
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: transparent;
            color: #c4b5fd;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .feedback-btn:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: #a855f7;
        }

        .feedback-btn.selected {
            background: rgba(168, 85, 247, 0.25);
            border-color: #a855f7;
            color: #fff;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 100;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: linear-gradient(135deg, #059669, #10b981);
        }

        .toast.error {
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }

        .error-text {
            color: #f87171;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.6rem; }
            .function-tab { min-width: 100%; }
            .prompt-selector { flex-direction: column; }
            .prompt-btn { text-align: center; }
            .card { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-robot"></i> AI Assistant</h1>
            <p>Powered by DeepSeek V4 Flash Free</p>
        </header>

        <div class="function-tabs" id="functionTabs"></div>

        <div class="card">
            <div class="prompt-selector" id="promptSelector"></div>

            <textarea id="userInput" placeholder="Type your question or text here..." rows="5"></textarea>
            <br>
            <button class="submit-btn" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Generate Response
            </button>

            <div class="response-area" id="responseArea"></div>

            <div class="feedback-area" id="feedbackArea">
                <span>Was this response helpful?</span>
                <button class="feedback-btn" data-value="yes"><i class="fas fa-thumbs-up"></i> Yes</button>
                <button class="feedback-btn" data-value="no"><i class="fas fa-thumbs-down"></i> No</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const functions = {{ functions|tojson }};
        let currentFunc = Object.keys(functions)[0];
        let currentPrompt = null;
        let lastResponse = null;

        const functionTabs = document.getElementById('functionTabs');
        const promptSelector = document.getElementById('promptSelector');
        const userInput = document.getElementById('userInput');
        const submitBtn = document.getElementById('submitBtn');
        const responseArea = document.getElementById('responseArea');
        const feedbackArea = document.getElementById('feedbackArea');
        const toast = document.getElementById('toast');

        function renderFunctionTabs() {
            functionTabs.innerHTML = '';
            Object.entries(functions).forEach(([key, func]) => {
                const tab = document.createElement('div');
                tab.className = `function-tab${key === currentFunc ? ' active' : ''}`;
                tab.innerHTML = `
                    <i class="fas ${func.icon}"></i>
                    <span class="func-name">${func.name}</span>
                    <span class="func-desc">${func.description}</span>
                `;
                tab.onclick = () => selectFunction(key);
                functionTabs.appendChild(tab);
            });
        }

        function selectFunction(key) {
            currentFunc = key;
            document.querySelectorAll('.function-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.function-tab:nth-child(${Object.keys(functions).indexOf(key) + 1})`).classList.add('active');
            currentPrompt = functions[key].prompts[0].id;
            renderPrompts();
            userInput.value = '';
            responseArea.classList.remove('show');
            feedbackArea.classList.remove('show');
            lastResponse = null;
        }

        function renderPrompts() {
            promptSelector.innerHTML = '';
            const func = functions[currentFunc];
            func.prompts.forEach(p => {
                const btn = document.createElement('button');
                btn.className = `prompt-btn${p.id === currentPrompt ? ' active' : ''}`;
                btn.textContent = p.label;
                btn.onclick = () => {
                    currentPrompt = p.id;
                    document.querySelectorAll('.prompt-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                promptSelector.appendChild(btn);
            });
        }

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        submitBtn.addEventListener('click', async () => {
            const input = userInput.value.trim();
            if (!input) {
                showToast('Please enter some text', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            responseArea.className = 'response-area loading';
            responseArea.textContent = 'Generating response...';
            responseArea.classList.add('show');
            feedbackArea.classList.remove('show');

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        function: currentFunc,
                        prompt: currentPrompt,
                        input: input
                    })
                });

                const data = await res.json();

                if (data.error) {
                    responseArea.className = 'response-area show';
                    responseArea.innerHTML = `<span class="error-text"><i class="fas fa-exclamation-circle"></i> ${data.error}</span>`;
                    showToast('Error generating response', 'error');
                    return;
                }

                lastResponse = data.response;
                responseArea.className = 'response-area show';
                responseArea.textContent = data.response;
                feedbackArea.classList.add('show');
                document.querySelectorAll('.feedback-btn').forEach(b => b.classList.remove('selected'));
            } catch (err) {
                responseArea.className = 'response-area show';
                responseArea.innerHTML = `<span class="error-text"><i class="fas fa-exclamation-circle"></i> Network error. Please try again.</span>`;
                showToast('Connection error', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Generate Response';
            }
        });

        document.querySelectorAll('.feedback-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const helpful = btn.dataset.value === 'yes';
                document.querySelectorAll('.feedback-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');

                await fetch('/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        function: currentFunc,
                        prompt: currentPrompt,
                        input: userInput.value.trim(),
                        response: lastResponse,
                        helpful: helpful
                    })
                });

                showToast('Thank you for your feedback!');
            });
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                submitBtn.click();
            }
        });

        renderFunctionTabs();
        currentPrompt = functions[currentFunc].prompts[0].id;
        renderPrompts();
    </script>
</body>
</html>
