<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversational AI Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }

        header {
            text-align: center;
            padding: 16px 0 12px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #06b6d4, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        header h1 i { -webkit-text-fill-color: #06b6d4; }
        header p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }

        .mode-selector {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            padding: 8px 0;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            color: #94a3b8;
            font-size: 0.82rem;
        }

        .mode-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(139,92,246,0.2));
            border-color: #06b6d4;
            color: #fff;
            box-shadow: 0 0 20px rgba(6,182,212,0.15);
        }

        .mode-btn i { display: block; font-size: 1.2rem; margin-bottom: 4px; }
        .mode-btn .mode-label { font-weight: 600; }

        .chat-container {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot { align-self: flex-start; }

        .msg-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .message.user .msg-icon {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }

        .message.bot .msg-icon {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.92rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .msg-bubble {
            background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(139,92,246,0.2));
            border: 1px solid rgba(59,130,246,0.3);
            border-bottom-right-radius: 4px;
        }

        .message.bot .msg-bubble {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-bottom-left-radius: 4px;
        }

        .message.bot .feedback-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .message.bot .feedback-row button {
            background: none;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 3px 10px;
            color: #64748b;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }

        .message.bot .feedback-row button:hover {
            background: rgba(6,182,212,0.1);
            border-color: #06b6d4;
            color: #06b6d4;
        }

        .message.bot .feedback-row button.selected {
            background: rgba(6,182,212,0.15);
            border-color: #06b6d4;
            color: #06b6d4;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        .input-area {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 0 0 16px 16px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            color: #e0e0e0;
            font-size: 0.92rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .input-area input:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6,182,212,0.1);
        }

        .input-area input::placeholder { color: #475569; }

        .input-area button {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(6,182,212,0.3);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .input-area button.reset-btn {
            background: rgba(255,255,255,0.08);
            width: 40px;
            height: 40px;
            align-self: center;
        }

        .input-area button.reset-btn:hover {
            background: rgba(239,68,68,0.2);
            box-shadow: none;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #475569;
            text-align: center;
            gap: 10px;
        }

        .empty-state i { font-size: 3rem; color: rgba(6,182,212,0.3); }
        .empty-state h3 { color: #64748b; font-weight: 500; }
        .empty-state p { font-size: 0.85rem; max-width: 300px; }

        .welcome-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 6px;
        }

        .welcome-suggestions button {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 5px 14px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .welcome-suggestions button:hover {
            background: rgba(6,182,212,0.1);
            border-color: #06b6d4;
            color: #06b6d4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container { height: 100dvh; padding: 0; }
            body { padding: 10px; }
            header h1 { font-size: 1.4rem; }
            .mode-btn { font-size: 0.7rem; padding: 8px 6px; }
            .mode-btn i { font-size: 1rem; }
            .message { max-width: 92%; }
            .messages { padding: 14px; }
            .input-area { padding: 12px 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-robot"></i> AI Chatbot</h1>
            <p>Powered by DeepSeek V4 Flash Free</p>
        </header>

        <div class="mode-selector" id="modeSelector">
            {% for key, mode in modes.items() %}
            <div class="mode-btn {% if loop.first %}active{% endif %}" data-mode="{{ key }}">
                <i class="fas {{ mode.icon }}"></i>
                <span class="mode-label">{{ mode.name }}</span>
            </div>
            {% endfor %}
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-comment-dots"></i>
                    <h3>Start a conversation!</h3>
                    <p>Choose a mode and say hello, ask a question, or try one of these:</p>
                    <div class="welcome-suggestions" id="suggestions"></div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="Type a message..." autofocus>
                <button class="reset-btn" id="resetBtn" title="Clear conversation">
                    <i class="fas fa-trash-alt"></i>
                </button>
                <button id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const modes = {{ modes|tojson }};
        let currentMode = 'general';
        let isSending = false;

        const suggestions = {
            general: [
                "Tell me a fun fact!",
                "What's the weather like?",
                "How was your day?",
                "Tell me a joke",
            ],
            info: [
                "Recommend a good book",
                "Explain black holes",
                "Best places to visit in India",
                "Tips for learning Python",
            ],
            creative: [
                "Tell me a bedtime story",
                "Write a poem about stars",
                "Make up a superhero",
                "Describe a dragon",
            ],
        };

        function getSuggestions() {
            return suggestions[currentMode] || suggestions.general;
        }

        function renderSuggestions() {
            const container = document.getElementById('suggestions');
            container.innerHTML = '';
            getSuggestions().forEach(s => {
                const btn = document.createElement('button');
                btn.textContent = s;
                btn.onclick = () => {
                    document.getElementById('userInput').value = s;
                    sendMessage();
                };
                container.appendChild(btn);
            });
        }

        function getHistory() {
            return fetch('/history').then(r => r.json());
        }

        function loadHistory() {
            getHistory().then(data => {
                const container = document.getElementById('messages');
                const emptyState = document.getElementById('emptyState');
                container.innerHTML = '';

                if (data.history.length === 0) {
                    container.appendChild(emptyState);
                    emptyState.style.display = 'flex';
                    renderSuggestions();
                    return;
                }

                emptyState.style.display = 'none';
                data.history.forEach((entry, i) => {
                    appendMessage(entry.user, 'user');
                    appendMessage(entry.bot, 'bot', entry.mode, i);
                });
                scrollToBottom();
            });
        }

        function appendMessage(text, role, mode, index) {
            const container = document.getElementById('messages');
            const emptyState = document.getElementById('emptyState');
            emptyState.style.display = 'none';

            const div = document.createElement('div');
            div.className = `message ${role}`;

            const icon = document.createElement('div');
            icon.className = 'msg-icon';
            icon.innerHTML = role === 'user'
                ? '<i class="fas fa-user"></i>'
                : '<i class="fas fa-robot"></i>';

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.textContent = text;

            div.appendChild(icon);
            div.appendChild(bubble);

            if (role === 'bot') {
                const feedback = document.createElement('div');
                feedback.className = 'feedback-row';
                feedback.innerHTML = `
                    <button class="feedback-btn" data-value="yes"><i class="fas fa-thumbs-up"></i></button>
                    <button class="feedback-btn" data-value="no"><i class="fas fa-thumbs-down"></i></button>
                `;
                feedback.querySelectorAll('.feedback-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const helpful = btn.dataset.value === 'yes';
                        feedback.querySelectorAll('.feedback-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');

                        await fetch('/feedback', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                mode: mode || currentMode,
                                message: getHistoryMessage(index),
                                response: text,
                                helpful: helpful,
                            })
                        });
                    });
                });
                bubble.appendChild(feedback);
            }

            container.appendChild(div);
            scrollToBottom();
        }

        function getHistoryMessage(index) {
            const container = document.getElementById('messages');
            const msgs = container.querySelectorAll('.message.user .msg-bubble');
            return msgs[index] ? msgs[index].textContent : '';
        }

        function scrollToBottom() {
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            const container = document.getElementById('messages');
            const emptyState = document.getElementById('emptyState');
            emptyState.style.display = 'none';

            const div = document.createElement('div');
            div.className = 'message bot';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="msg-icon"><i class="fas fa-robot"></i></div>
                <div class="msg-bubble">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            container.appendChild(div);
            scrollToBottom();
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg || isSending) return;

            input.value = '';
            isSending = true;
            document.getElementById('sendBtn').disabled = true;

            appendMessage(msg, 'user');
            showTyping();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: currentMode, message: msg })
                });

                hideTyping();
                const data = await res.json();

                if (data.error) {
                    appendMessage('Error: ' + data.error, 'bot');
                    return;
                }

                appendMessage(data.response, 'bot', currentMode);
            } catch (err) {
                hideTyping();
                appendMessage('Network error. Please try again.', 'bot');
            } finally {
                isSending = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('userInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendMessage();
        });

        document.getElementById('resetBtn').addEventListener('click', async () => {
            await fetch('/reset', { method: 'POST' });
            loadHistory();
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                loadHistory();
            });
        });

        renderSuggestions();
        loadHistory();
    </script>
</body>
</html>
